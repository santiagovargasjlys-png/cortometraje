<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #F5EEDC;
            background-image: 
                /* Manchas de tinta */
                radial-gradient(ellipse at 10% 20%, rgba(120, 85, 55, 0.20) 0%, transparent 40%),
                radial-gradient(ellipse at 90% 80%, rgba(120, 85, 55, 0.18) 0%, transparent 45%),
                radial-gradient(ellipse at 50% 10%, rgba(145, 110, 75, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 20% 85%, rgba(130, 95, 65, 0.22) 0%, transparent 35%),
                radial-gradient(ellipse at 80% 25%, rgba(140, 105, 70, 0.16) 0%, transparent 42%),
                radial-gradient(ellipse at 60% 90%, rgba(125, 90, 60, 0.18) 0%, transparent 38%),
                radial-gradient(circle at 35% 45%, rgba(150, 115, 80, 0.12) 0%, transparent 25%),
                radial-gradient(circle at 65% 60%, rgba(135, 100, 68, 0.10) 0%, transparent 30%),
                /* Textura de papel */
                linear-gradient(90deg, rgba(139, 109, 78, 0.03) 1px, transparent 1px),
                linear-gradient(rgba(139, 109, 78, 0.03) 1px, transparent 1px);
            background-size: 
                100% 100%, 100% 100%, 100% 100%, 100% 100%,
                100% 100%, 100% 100%, 100% 100%, 100% 100%,
                60px 60px, 60px 60px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Recortes de periódico a los lados */
        .recorte-izq, .recorte-der {
            position: fixed;
            width: 180px;
            height: 280px;
            background: linear-gradient(135deg, #F2E8D5 0%, #E8DBC8 100%);
            border: 1px solid rgba(139, 109, 78, 0.25);
            box-shadow: 4px 6px 12px rgba(80, 60, 40, 0.15);
            padding: 15px;
            font-size: 9px;
            line-height: 1.6;
            color: rgba(90, 70, 50, 0.35);
            transform: rotate(-6deg);
            z-index: 0;
        }

        .recorte-izq {
            left: 20px;
            top: 50%;
            transform: translateY(-50%) rotate(-6deg);
        }

        .recorte-der {
            right: 20px;
            top: 50%;
            transform: translateY(-50%) rotate(5deg);
        }

        .recorte-der .linea:nth-child(even) {
            width: 85%;
        }
        .recorte-der .linea:nth-child(odd) {
            width: 95%;
        }
        .recorte-izq .linea:nth-child(even) {
            width: 90%;
        }
        .recorte-izq .linea:nth-child(odd) {
            width: 80%;
        }

        .linea {
            height: 3px;
            background: rgba(110, 85, 60, 0.15);
            margin-bottom: 6px;
            border-radius: 1px;
        }

        /* Sello antiguo */
        .sello {
            position: fixed;
            top: 40px;
            right: 60px;
            width: 90px;
            height: 90px;
            border: 3px solid rgba(115, 40, 40, 0.25);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 11px;
            color: rgba(115, 40, 40, 0.35);
            transform: rotate(-15deg);
            text-transform: uppercase;
            letter-spacing: 2px;
            z-index: 0;
        }

        /* Esquinas desgastadas */
        .esquina-sup-izq, .esquina-sup-der,
        .esquina-inf-izq, .esquina-inf-der {
            position: fixed;
            width: 100px;
            height: 100px;
            border: 3px solid rgba(139, 109, 78, 0.12);
            z-index: 0;
        }

        .esquina-sup-izq { top: 20px; left: 20px; border-right: none; border-bottom: none; }
        .esquina-sup-der { top: 20px; right: 20px; border-left: none; border-bottom: none; }
        .esquina-inf-izq { bottom: 20px; left: 20px; border-right: none; border-top: none; }
        .esquina-inf-der { bottom: 20px; right: 20px; border-left: none; border-top: none; }

        .contenedor-video {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 820px;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 
                0 8px 24px rgba(92, 69, 49, 0.25),
                0 0 0 1px rgba(139, 109, 78, 0.15);
            background: #fff;
            border: 8px solid #F9F4EA;
        }

        video, iframe {
            width: 100%;
            height: 460px;
            border: none;
            display: block;
        }

        @media (max-width: 900px) {
            .recorte-izq, .recorte-der, .sello, .esquina-sup-izq,
            .esquina-sup-der, .esquina-inf-izq, .esquina-inf-der {
                display: none;
            }
        }

        @media (max-width: 600px) {
            video, iframe {
                height: 240px;
            }
        }
    </style>
</head>
<body>

    <!-- Recorte de periódico izquierdo -->
    <div class="recorte-izq">
        <div class="linea"></div>
        <div class="linea"></div>
        <div class="linea"></div>
        <div class="linea"></div>
        <div class="linea"></div>
        <div class="linea"></div>
        <div class="linea"></div>
        <div class="linea"></div>
        <div class="linea"></div>
        <div class="linea"></div>
        <div class="linea"></div>
        <div class="linea"></div>
    </div>

    <!-- Recorte de periódico derecho -->
    <div class="recorte-der">
        <div class="linea"></div>
        <div class="linea"></div>
        <div class="linea"></div>
        <div class="linea"></div>
        <div class="linea"></div>
        <div class="linea"></div>
        <div class="linea"></div>
        <div class="linea"></div>
        <div class="linea"></div>
        <div class="linea"></div>
        <div class="linea"></div>
        <div class="linea"></div>
    </div>

    <!-- Sello antiguo -->
    <div class="sello">
        ORIGEN<br>✦
    </div>

    <!-- Bordes de esquina -->
    <div class="esquina-sup-izq"></div>
    <div class="esquina-sup-der"></div>
    <div class="esquina-inf-izq"></div>
    <div class="esquina-inf-der"></div>

    <!-- Contenedor del video -->
    <div class="contenedor-video">
        <!-- ✅ PON TU VIDEO AQUÍ -->
        
        <!-- Opción A: Archivo de video -->
        <!-- <video src="tu-video.mp4" controls autoplay></video> -->

        <!-- Opción B: YouTube (usa el enlace que dice /embed/) -->
        <iframe src="ENLACE_DE_TU_VIDEO" allowfullscreen></iframe>
    </div>

</body>
</html>
